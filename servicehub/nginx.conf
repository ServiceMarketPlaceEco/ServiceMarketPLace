# nginx for the ServiceHub website container (see servicehub/Dockerfile)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # profile photos and chat messages are small, but keep a sensible limit
  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # the API lives in the backend container
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # the backend reads these (TRUST_PROXY=1) so rate limits see each visitor
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # built files have a hash in their name, so browsers can keep them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # everything else is the single-page app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
