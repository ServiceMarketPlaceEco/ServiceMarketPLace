server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # service photos are uploaded through the API
  client_max_body_size 10m;

  # API requests go to the backend container
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # keep the visitor IP the server's own nginx already put in this header,
    # so the backend's rate limits see real visitors (TRUST_PROXY=2)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # hashed build files never change, cache them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # everything else is the single page app
  location / {
    try_files $uri $uri/ /index.html;
  }
}
