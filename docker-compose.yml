# ServiceHub on one server with Docker.
#
#   cp .env.docker.example .env      then fill in the values
#   docker compose up -d --build     builds and starts everything
#
# db       MySQL 8.4. The first start builds the database from the migrations
#          and the production-safe seeds (backend/database/docker-init.sh) and
#          keeps it in the db-data volume, so later restarts keep all data.
# backend  the API (NestJS), only reachable from the other containers
# web      nginx with the built website, which passes /api on to the backend
# caddy    optional HTTPS with a free certificate:
#          docker compose --profile https up -d --build
#
# Full steps, backups and updates: deploy/DEPLOY.md

name: servicehub

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-servicehub}
      MYSQL_USER: ${DB_USERNAME:-servicehub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/database:/servicehub-db:ro
      - ./backend/database/docker-init.sh:/docker-entrypoint-initdb.d/10-servicehub.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      API_PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./servicehub
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to use HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web

volumes:
  db-data:
  caddy-data:
