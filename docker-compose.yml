# Production deployment on the team VPS. Run from
# /var/www/apps/servicemarketplace with:
#   sudo project-ctl build servicemarketplace
#   sudo project-ctl up servicemarketplace
# Settings come from two files that are never committed:
#   ./.env          compose settings (copy .env.example)
#   ./backend/.env  backend settings (copy backend/.env.example)
#
# Public traffic: Traefik (TLS) -> web (nginx: Vue build, /api proxy) -> api.
# No host ports are published; Traefik finds the web container by its labels.

services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      API_PORT: 3001
    restart: unless-stopped
    networks: [app, db]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 100

  web:
    build:
      context: ./servicehub
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on: [api]
    restart: unless-stopped
    networks: [app, traefik_public]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.servicemarketplace-https.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.servicemarketplace-https.entrypoints=websecure"
      - "traefik.http.routers.servicemarketplace-https.tls=true"
      - "traefik.http.routers.servicemarketplace-https.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.servicemarketplace-https.service=servicemarketplace-service"
      - "traefik.http.services.servicemarketplace-service.loadbalancer.server.port=80"

  # one-off: creates the tables and loads the seed data, then exits.
  # only runs when COMPOSE_PROFILES=dbsetup is set in ./.env
  db-setup:
    build: ./backend
    env_file: ./backend/.env
    command: ["node", "database/setup.js"]
    restart: "no"
    profiles: [dbsetup]
    networks: [db]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 100

networks:
  # private network between web and api
  app: {}
  # the shared reverse proxy
  traefik_public:
    external: true
  # the project's network that the global-db MySQL container is attached to
  db:
    external: true
    name: net_servicemarketplace
