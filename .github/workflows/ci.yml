# runs every test on github for each push and pull request
# (should-fix 9 in the client's code review). none of the tests need mysql,
# an api key or the internet, so nothing has to be set up on github first.
# a failing test shows up as a red cross on the pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + integration tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # unit and integration tests together, with the coverage summary
      - run: npm run test:cov:all
      - run: npm run build

  frontend:
    name: Frontend (Vitest, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicehub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # playwright starts the dev server itself (see playwright.config.js)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: servicehub/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a throwaway settings file, only so docker compose can read the file
      - run: cp .env.docker.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend web
